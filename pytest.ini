[pytest]
# Scope to the PDF-to-3D Python packages (docs/plan/pdf-to-3d-development-plan.md).
# client/ and server/ are the unrelated ZeroBudget TypeScript app in this
# same repo and must never be walked by the Python test collector.
testpaths = packages tests
norecursedirs = client server node_modules dist .git .hypothesis *.egg-info
