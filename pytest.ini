[pytest]
# Scope to the PDF-to-3D Python packages (docs/plan/pdf-to-3d-development-plan.md).
# testpaths already keeps the collector out of the top-level client/ and
# server/ directories (the unrelated ZeroBudget TypeScript app in this
# same repo) by only ever looking inside packages/ and tests/. Do NOT add
# "client" or "server" to norecursedirs: it matches by directory basename
# anywhere in the tree, not by path, so it would also silently exclude
# packages/server/ (this project's own Python package) — which is exactly
# what happened here once that package existed.
testpaths = packages tests
norecursedirs = node_modules dist .git .hypothesis *.egg-info
