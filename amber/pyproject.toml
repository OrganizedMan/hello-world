[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amber"
version = "0.1.0"
description = "Local 3D memory capture: iPhone video to an explorable Gaussian-splat scene, entirely on-device"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
amber = "amber.cli:main"

[tool.setuptools.packages.find]
include = ["amber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
