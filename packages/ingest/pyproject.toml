[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf3d-ingest"
version = "0.1.0"
description = "PDF open, page rasterisation, and capability-tier detection — behind a swappable backend (plan §18 R5)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
