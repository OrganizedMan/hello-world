[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf3d-fixtures-garrigan"
version = "0.1.0"
description = "The Garrigan family room, hand-traced end to end (Stage 0 / Sprint 2 proof)"
requires-python = ">=3.11"
dependencies = ["pdf3d-core-schema", "pdf3d-units", "pdf3d-constraints"]

[tool.setuptools.packages.find]
where = ["src"]
