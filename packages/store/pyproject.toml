[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf3d-store"
version = "0.1.0"
description = "SQLite project file: content-addressed source documents and the approval-script log"
requires-python = ">=3.11"
dependencies = ["pdf3d-core-schema"]

[tool.setuptools.packages.find]
where = ["src"]
