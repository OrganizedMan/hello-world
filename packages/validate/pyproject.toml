[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validate"
version = "0.1.0"
description = "The validation report: the blocking gate before Build (plan §12)"
requires-python = ">=3.11"
dependencies = ["core-schema", "constraints", "networkx>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
