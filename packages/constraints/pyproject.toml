[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf3d-constraints"
version = "0.1.0"
description = "Linear constraint-system assembly and rank/nullspace diagnostics (plan §8)"
requires-python = ">=3.11"
dependencies = ["pdf3d-core-schema", "numpy>=2", "scipy>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]
